name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visagassist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+pg8000://postgres:postgres@localhost:5432/visagassist_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tipos (mypy estricto)
        run: mypy src tests
      - name: Pruebas (pytest con PostgreSQL real)
        run: pytest

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen
        run: docker build -t visagassist .
      - name: Arranca y responde /api/v1/estado
        run: |
          docker run -d --name asistente -p 8000:8000 --entrypoint uvicorn visagassist             visagassist.api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/estado && exit 0
            sleep 1
          done
          docker logs asistente
          exit 1
