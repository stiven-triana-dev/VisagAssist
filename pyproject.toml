[project]
name = "visagassist"
version = "0.1.0"
description = "Asistente con IA para VisagShop: responde preguntas en español consultando los datos reales de la tienda."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pg8000>=1.31",  # conector en Python puro (ver README: decisiones técnicas)
    "pydantic-settings>=2.4",
    "httpx>=0.27",   # llamadas HTTP a la API de Claude
    "pyjwt>=2.8",    # identidad firmada que envía VisagShop
    "alembic>=1.13", # migraciones de la base propia del asistente
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "-q"
markers = [
    "integracion: pruebas que usan PostgreSQL real (necesitan TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y signos del español en textos y comentarios

[tool.ruff.lint.isort]
known-first-party = ["visagassist", "evaluaciones"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y contraseñas ficticias en pruebas

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src,tests"
packages = ["visagassist", "evaluaciones"]
